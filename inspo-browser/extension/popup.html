<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Shared design system (generated from claude-sandbox/design-system) -->
  <link rel="stylesheet" href="ds.css">
  <style>
    body { width: 280px; margin: 0; background: var(--ds-surface); font-size: var(--ds-text-sm); }
    .header { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px 0 14px; }
    .logo { font-family: var(--ds-font-display); font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
    .logo span { color: var(--ds-chrome-muted); }
    .gear-btn { margin-left: auto; color: var(--ds-chrome-muted); }
    .gear-btn:hover, .gear-btn.active { color: var(--ds-chrome-text); background: var(--ds-chrome-hover); }
    .section { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .shot-row { display: flex; gap: 8px; }
    .shot-row .ds-btn { flex: 1; min-width: 0; height: auto; min-height: 34px; padding: 6px 8px; white-space: normal; line-height: 1.2; letter-spacing: 0.03em; }
    .hint { margin: 2px 0 0; text-align: center; }
    .divider { height: 1px; background: var(--ds-hairline); border: 0; margin: 4px 0; }
    .field-row { display: flex; align-items: center; gap: 8px; color: var(--ds-ink-muted); }
    .field-row .ds-input, .field-row .ds-select { flex: 1; padding: 6px 8px; font-size: var(--ds-text-sm); }
    .field-row .ds-label { width: 44px; flex-shrink: 0; }
    .settings { display: none; padding: 16px; border-top: 1px solid var(--ds-line); }
    .settings.open { display: flex; flex-direction: column; gap: 10px; }
    .status { min-height: 16px; text-align: center; font-size: 12px; color: var(--ds-success-fg); }
    .not-configured { padding: 20px 16px; text-align: center; }
  </style>
</head>
<body class="ds-root">
  <div class="header ds-chrome">
    <img src="icon48.png" width="18" height="18" alt="" style="border-radius:4px">
    <span class="logo">Swatch<span>Book</span></span>
    <button class="gear-btn ds-icon-btn" id="gear-btn" title="Settings" aria-label="Settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div id="main-section" class="section" style="display:none">
    <button class="pick-btn ds-btn ds-btn--primary ds-btn--block" id="pick-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      Pick images from this page
    </button>

    <hr class="divider">

    <div class="shot-row">
      <button class="shot-btn ds-btn ds-btn--sm" id="shot-full-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        Screenshot view
      </button>
      <button class="shot-btn ds-btn ds-btn--sm" id="shot-area-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        Select area
      </button>
    </div>

    <p class="hint ds-small ds-muted">Or right-click any image → <strong>Save to SwatchBook</strong></p>
    <hr class="divider">
    <div id="folder-selector-row" class="field-row" style="display:none">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span class="ds-label">Folder</span>
      <select id="folder-select" class="ds-select"></select>
    </div>
    <div class="field-row">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
      <input id="tag-input" class="ds-input" type="text" placeholder="Tags, comma separated (optional)" aria-label="Tags">
    </div>
    <hr class="divider">
    <div id="flow-selector-row" class="field-row" style="display:none">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span class="ds-label">Flow</span>
      <select id="flow-select" class="ds-select">
        <option value="">None</option>
      </select>
    </div>
  </div>

  <div id="setup-section" class="not-configured ds-empty" style="display:none">
    <div class="ds-empty__title">Set up SwatchBook</div>
    Open settings (gear icon) to add your server URL and API token.
  </div>

  <div class="settings" id="settings-panel">
    <label class="ds-field"><span class="ds-label">Server URL</span>
      <input id="server-url" class="ds-input" type="url" placeholder="https://your-app.railway.app"></label>
    <label class="ds-field"><span class="ds-label">API token</span>
      <input id="api-token" class="ds-input" type="password" placeholder="Your INSPO_API_TOKEN"></label>
    <button class="save-btn ds-btn ds-btn--block" id="save-btn">Save settings</button>
    <div class="status" id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
